name: Godot Release

# Al entrar a main exporta Windows y Linux y publica el release vX.Y.Z,
# donde la versión sale de config/version en armagedon/project.godot.
# Si el tag ya existe no hace nada (para sacar otra versión, sube config/version).
# Requiere armagedon/export_presets.cfg con presets "Windows Desktop" y "Linux".
on:
  push:
    branches: [main]
    paths:
      - "armagedon/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_PATH: armagedon

jobs:
  version:
    name: Leer versión
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^config\/version="\(.*\)"/\1/p' "$PROJECT_PATH/project.godot")
          [ -n "$VERSION" ] || { echo "::error::Falta config/version en project.godot"; exit 1; }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  export:
    name: Exportar (${{ matrix.preset }})
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Windows Desktop"
            file: armageddon-windows.exe
            name: windows
          - preset: "Linux"
            file: armageddon-linux.x86_64
            name: linux
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Exportar
        run: |
          mkdir -p build/${{ matrix.name }}
          godot --headless --path "$PROJECT_PATH" --import --quit
          godot --headless --path "$PROJECT_PATH" --export-release "${{ matrix.preset }}" "$GITHUB_WORKSPACE/build/${{ matrix.name }}/${{ matrix.file }}"
      - name: Empaquetar
        run: cd build/${{ matrix.name }} && zip -r ../armageddon-${{ matrix.name }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: armageddon-${{ matrix.name }}
          path: build/armageddon-${{ matrix.name }}.zip

  release:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: [version, export]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Armageddon $TAG" --generate-notes --target "$GITHUB_SHA"
