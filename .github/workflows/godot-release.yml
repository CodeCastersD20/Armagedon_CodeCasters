name: Godot Release

# Exporta el juego y publica un GitHub Release cuando se integra algo en main.
# Requiere armagedon/export_presets.cfg con presets llamados "Windows Desktop" y "Linux".
on:
  push:
    branches: [main]
    paths:
      - "armagedon/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.0"
  PROJECT_PATH: armagedon

jobs:
  export:
    name: Exportar (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Windows Desktop"
            file: armageddon-windows.exe
            name: windows
          - preset: "Linux"
            file: armageddon-linux.x86_64
            name: linux
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Exportar
        run: |
          mkdir -p build/${{ matrix.name }}
          godot --headless --path "$PROJECT_PATH" --import --quit
          godot --headless --path "$PROJECT_PATH" --export-release "${{ matrix.preset }}" "$GITHUB_WORKSPACE/build/${{ matrix.name }}/${{ matrix.file }}"
      - name: Empaquetar
        run: cd build/${{ matrix.name }} && zip -r ../armageddon-${{ matrix.name }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: armageddon-${{ matrix.name }}
          path: build/armageddon-${{ matrix.name }}.zip

  release:
    name: Publicar release
    runs-on: ubuntu-latest
    needs: export
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +'%Y.%m.%d-%H%M%S')"
          gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Armageddon $TAG" --generate-notes --target "$GITHUB_SHA"
